project:
  name: churn-prediction-ml
  random_state: 42

data:
  raw_path: data/raw/clientes.csv
  processed_path: data/processed/clientes_clean.parquet
  target_column: churn
  test_size: 0.2

model:
  type: RandomForestClassifier
  params:
    n_estimators: 200
    max_depth: 10
    class_weight: balanced
  output_path: models/churn_model.joblib
